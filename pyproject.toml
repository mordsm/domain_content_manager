[project]
name = "domain-content-manager"
version = "0.1.0"
description = "Voice-First Multi-Domain Content Management System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer>=0.12.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
